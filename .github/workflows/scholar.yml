name: Update Google Scholar metrics

on:
  schedule:
    - cron: "0 6 * * 1"        # every Monday 06:00 UTC
  workflow_dispatch:            # allow manual run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scholarly
        run: pip install scholarly
      - name: Fetch Scholar metrics
        run: python scripts/update_scholar.py
      - name: Commit changes
        run: |
          git config user.name "scholar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scholar.json
          if git diff --staged --quiet; then
            echo "No change in metrics."
          else
            git commit -m "Auto-update Google Scholar metrics"
            git push
          fi
